spring.application.name=companeros-app

# ===================================================================
# BASE DE DATOS (PostgreSQL)
# Copia este fichero como application.properties y rellena los valores
# ===================================================================
spring.datasource.url=jdbc:postgresql://<HOST>:<PORT>/<DB_NAME>
spring.datasource.username=<DB_USER>
spring.datasource.password=<DB_PASSWORD>
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Deshabilitar consola H2
spring.h2.console.enabled=false

# Multipart upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=35MB

# Directorio de subida de archivos
app.upload.dir=uploads/expenses
