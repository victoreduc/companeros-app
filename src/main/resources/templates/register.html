<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear Cuenta — Compañeros</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function(){
            var t=localStorage.getItem('theme'), d=window.matchMedia('(prefers-color-scheme:dark)').matches;
            if(t==='dark-mode'||(!t&&d)) document.documentElement.classList.add('dark-mode');
        })();
    </script>
</head>
<body>

<div class="auth-wrapper">

    <!-- Hero (desktop only) -->
    <div class="auth-hero">
        <img th:src="@{/images/logo.png}" alt="Compañeros" class="auth-hero-logo" onerror="this.style.display='none'">
        <p class="auth-hero-brand">Compañeros</p>
        <h1 class="auth-hero-title">
            Tu piso,<br><em>en orden.</em>
        </h1>
        <p class="auth-hero-sub">
            Crea tu cuenta, forma tu casa y empieza a organizar la convivencia con tus compañeros hoy mismo.
        </p>
    </div>

    <!-- Form section -->
    <div class="auth-form-section">
        <div class="auth-card">

            <div class="auth-logo-mobile">
                <img th:src="@{/images/logo.png}" alt="Logo" onerror="this.style.display='none'">
                <span>Compañeros</span>
            </div>

            <h1 class="auth-title">Crear cuenta</h1>
            <p class="auth-subtitle">Únete y organiza tu hogar.</p>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="form-group">
                    <label for="name">Nombre completo</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control"
                           placeholder="Ej. Juan Pérez" required autofocus/>
                </div>
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control"
                           placeholder="Ej. juan" required autocomplete="username"/>
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           placeholder="ejemplo@correo.com" required/>
                </div>
                <div class="form-group">
                    <label for="birthDate">Fecha de nacimiento</label>
                    <input type="date" id="birthDate" th:field="*{birthDate}" class="form-control" required/>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control"
                           placeholder="••••••••" required autocomplete="new-password"/>
                </div>
                <button type="submit" class="btn btn-primary btn-full" style="margin-top: 8px;">
                    Crear cuenta
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </form>

            <p class="auth-footer">
                ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
            </p>
        </div>
    </div>

</div>
</body>
</html>
