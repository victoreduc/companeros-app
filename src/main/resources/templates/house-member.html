<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mi Casa — Compañeros</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function(){
            var t=localStorage.getItem('theme'), d=window.matchMedia('(prefers-color-scheme:dark)').matches;
            if(t==='dark-mode'||(!t&&d)) document.documentElement.classList.add('dark-mode');
        })();
    </script>
</head>
<body>

<div class="app-layout">

    <nav class="app-nav">
        <a th:href="@{/}" class="nav-brand">
            <img th:src="@{/images/logo.png}" alt="Logo" class="nav-brand-logo" onerror="this.style.display='none'">
            <span class="nav-brand-text">Compañeros</span>
        </a>
        <div class="nav-links">
            <a th:href="@{/tasks}" class="nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                <span>Tareas</span>
            </a>
            <a th:href="@{/shopping}" th:if="${currentUser.house == null or currentUser.house.shoppingEnabled}" class="nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span>Compras</span>
            </a>
            <a th:href="@{/expenses}" th:if="${currentUser.house == null or currentUser.house.expensesEnabled}" class="nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                <span>Gastos</span>
            </a>
            <a th:href="@{/house}" class="nav-link active">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Mi Casa</span>
            </a>
            <a th:href="@{/settings}" class="nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span>Ajustes</span>
            </a>
        </div>
        <div class="nav-notif-wrapper" id="nav-notif-wrapper">
            <button type="button" class="nav-notif-btn" id="bell-btn" onclick="toggleNotifPanel()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span>Notificaciones</span>
                <span class="notif-badge" id="notif-badge" style="display:none">0</span>
            </button>
            <div class="notif-panel" id="notif-panel">
                <div class="notif-panel-head">
                    <span class="notif-panel-title">Notificaciones</span>
                    <button type="button" class="notif-mark-all-btn" id="mark-all-btn" onclick="markAllNotifRead()" style="display:none">Marcar como leídas</button>
                </div>
                <div class="notif-list" id="notif-list"></div>
            </div>
        </div>
    </nav>

    <div class="app-content">
        <div class="container">

            <div class="page-header">
                <h1>Mi Casa 🏠</h1>
                <p th:text="${house.description != null and !house.description.isBlank()} ? ${house.description} : 'Información de tu hogar compartido.'">Información de tu hogar compartido.</p>
            </div>

            <div class="settings-layout">

                <!-- House info card -->
                <div class="settings-card">
                    <h2>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-3px;margin-right:6px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        <span th:text="${house.name}">Nombre de la casa</span>
                    </h2>
                    <p th:if="${house.description != null and !house.description.isBlank()}"
                       th:text="${house.description}"
                       style="color:var(--text-2); font-size:.9rem; margin-top:8px;"></p>
                </div>

                <!-- Members card -->
                <div class="settings-card">
                    <h2>
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-3px;margin-right:6px;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        Miembros
                        <span class="member-count" th:text="${members.size()}">0</span>
                    </h2>

                    <div class="member-list">
                        <div th:each="member : ${members}" class="member-row">
                            <div class="companion-avatar" th:text="${#strings.substring(member.name, 0, 1)}">J</div>
                            <div class="member-info">
                                <span class="member-name" th:text="${member.name}">Juan</span>
                                <span class="member-username" th:text="'@' + ${member.username}">@juan</span>
                            </div>
                            <span class="role-badge"
                                  th:classappend="${member.role != null && member.role.name() == 'HOUSE_ADMIN'} ? ' role-admin' : ' role-member'"
                                  th:text="${member.role != null ? member.role.displayName : 'Sin rol'}">Rol</span>
                            <span th:if="${member.id == currentUser.id}" style="font-size:.78rem; color:var(--text-2); padding:0 8px;">Tú</span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Leave house -->
            <div style="margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border);">
                <form th:action="@{/house/leave}" method="post"
                      onsubmit="return confirm('¿Seguro que quieres abandonar la casa? Perderás el acceso a todos sus datos.');">
                    <button type="submit" class="btn btn-ghost" style="color:var(--danger); border-color: var(--danger-bg); gap: 8px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        Abandonar casa
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
